<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Portfolio admin</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="admin.css">
  <script src="config.js"></script>
  <script src="admin.js" defer></script>
</head>
<body>
  <header class="top">
    <strong class="brand">Portfolio admin</strong>
    <div class="top-actions" id="top-actions" hidden>
      <select id="model-picker" aria-label="Choose a profile"></select>
      <button type="button" class="btn icon-btn ghost" id="new-model" aria-label="New profile" title="New profile"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button type="button" class="btn icon-btn ghost" id="generate-thumbnails" aria-label="Generate thumbnails" title="Generate thumbnails"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3zM19 15l1 2.5 2.5 1-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1 1-2.5z"/></svg></button>
      <a class="btn icon-btn ghost" id="view-site" aria-label="View site" title="View site" target="_blank" rel="noopener"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6m0-6-9 9"/><path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></svg></a>
      <button type="button" class="btn icon-btn ghost" id="archive-profile" aria-label="Archive profile" title="Archive profile"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18v5H3zM5 9v11h14V9M10 13h4"/></svg></button>
      <button type="button" class="btn icon-btn danger ghost" id="delete-profile" aria-label="Delete profile permanently" title="Delete profile permanently"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg></button>
      <button type="button" class="btn icon-btn ghost" id="sign-out" aria-label="Sign out" title="Sign out"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17l5-5-5-5m5 5H3"/><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/></svg></button>
    </div>
  </header>

  <main class="wrap">
    <section id="login" class="card login" hidden>
      <h1>Sign in</h1>
      <p class="muted">Enter the admin token to manage the profiles. It is kept only for this browser session.</p>
      <form id="login-form">
        <label>Admin token
          <input id="token" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn primary">Sign in</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>

    <section id="setup" class="card" hidden>
      <h1>Setup needed</h1>
      <p>Set <code>apiBase</code> in <code>admin/config.js</code> to the address of the admin Worker. The README explains how to deploy it.</p>
    </section>

    <section id="editor" hidden>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <div id="editor-body"></div>
      <div class="savebar">
        <div id="savebar-progress" class="savebar-progress" hidden></div>
        <div class="savebar-row">
          <span id="dirty-note" class="muted"></span>
          <button type="button" class="btn primary save-btn" id="save" aria-label="Save changes" title="Save changes"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h12l4 4v14H3V3z"/><path d="M7 3v6h10V3M7 21v-8h10v8"/></svg><span>Save</span></button>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
