# Optional standalone Cloudflare Worker config (only needed if hosting the static site outside
# Cloudflare Pages, e.g. on GitHub Pages). On Cloudflare Pages, /functions/api and /functions/media
# run automatically inside your Pages project — no separate Worker deploy is needed.
#
# Secrets are NOT stored in this file. Set them once with:
#   npx wrangler secret put ADMIN_TOKEN    (the password you type into the admin page)
#   npx wrangler secret put GITHUB_TOKEN   (a fine-grained GitHub token: Contents read & write, this repo only)

name = "portfolio-admin"
main = "src/index.mjs"
compatibility_date = "2026-01-01"

# Private R2 bucket that stores uploaded photos and videos.
# Public Development URL (r2.dev) does NOT need to be enabled: /media/* streams files directly.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "portfolio-media"

[vars]
REPO = "sumit2nandiuk-creator/ModelPortfolio"
BRANCH = "main"
# Comma-separated list of external origins allowed to call /api/* (same-origin is always allowed).
ADMIN_ORIGIN = "https://modelportfolio.pages.dev,https://sumit2nandiuk-creator.github.io"
